/* =========================
   BASIC
========================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    scroll-behavior:smooth;
}

body{
    background:#050505;
    color:#ffffff;
    font-family:Arial, Helvetica, sans-serif;
}

/* =========================
   NAVBAR
========================= */

nav{
    position:sticky;
    top:0;
    z-index:1000;

    background:#090909;

    padding:18px 7%;

    display:flex;
    justify-content:space-between;
    align-items:center;

    border-bottom:1px solid #222;
}

.logo{
    font-family:Georgia, serif;
    font-size:22px;
    font-weight:bold;
    letter-spacing:3px;
    color:#00eaff;
}

nav ul{
    list-style:none;
    display:flex;
    gap:22px;
}

nav a{
    color:#aaa;
    text-decoration:none;
    font-size:14px;
}

nav a:hover{
    color:#00eaff;
}

========================= */

    padding:40px 20px;

    background:

        circle at center,
        #07353d 0%,
        #050505 45%,
        #050505 100%

}

.hero{

    font-weight:900;

    color:transparent;
