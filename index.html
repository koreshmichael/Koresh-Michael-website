<style>

/* =========================
   RESET
========================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    scroll-behavior:smooth;
}

:root{
    --black:#030303;
    --dark:#0b0b0b;
    --card:#111111;
    --cyan:#00eaff;
    --white:#ffffff;
    --gray:#999999;
    --border:#242424;
}

body{
    background:var(--black);
    color:var(--white);
    font-family:Arial,Helvetica,sans-serif;
    overflow-x:hidden;
}

a{
    text-decoration:none;
}


/* =========================
   LOADING SCREEN
========================= */

.loader{
    position:fixed;
    inset:0;
    background:#000;
    z-index:9999;

    display:flex;
    align-items:center;
    justify-content:center;

    animation:hideLoader 1s ease 2s forwards;
}

.loader-content{
    text-align:center;
}

.loader-content h1{
    color:var(--cyan);
    font-family:Georgia,serif;
    font-size:55px;
    letter-spacing:8px;
    animation:pulse 1s infinite alternate;
}

.loader-content p{
    color:#666;
    font-size:10px;
    letter-spacing:5px;
    margin-top:12px;
}

@keyframes hideLoader{
    to{
        opacity:0;
        visibility:hidden;
    }
}

@keyframes pulse{
    from{
        opacity:.4;
        transform:scale(.96);
    }
    to{
        opacity:1;
        transform:scale(1);
    }
}


/* =========================
   NAVIGATION
========================= */

nav{
    position:fixed;
    top:0;
    left:0;
    width:100%;

    z-index:1000;

    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:18px 7%;

    background:rgba(0,0,0,.82);
    backdrop-filter:blur(15px);

    border-bottom:1px solid var(--border);
}

.logo{
    color:var(--cyan);
    font-size:22px;
    font-weight:bold;
    letter-spacing:4px;
}

nav ul{
    display:flex;
    list-style:none;
    gap:22px;
}

nav ul li a{
    color:#aaa;
    font-size:13px;
    transition:.3s;
}

nav ul li a:hover{
    color:var(--cyan);
}
