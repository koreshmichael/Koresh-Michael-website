*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    scroll-behavior:smooth;
}

:root{
    --bg:#040404;
    --card:rgba(255,255,255,0.05);
    --line:rgba(255,255,255,0.12);
    --white:#ffffff;
    --muted:#8d8d8d;
    --accent:#00eaff;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:var(--bg);
    color:white;
    overflow-x:hidden;
}

/* =========================
   LOADER
========================= */

.loader{
    position:fixed;
    inset:0;
    background:#030303;
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:9999;
    animation:loaderHide 1s ease 2s forwards;
}

.loader-text{
    text-align:center;
}

.loader-text h2{
    font-family:Georgia,serif;
    font-size:42px;
    letter-spacing:8px;
    color:var(--accent);
    animation:loaderPulse 1s infinite alternate;
}

.loader-text p{
    margin-top:12px;
    color:#666;
    letter-spacing:5px;
    font-size:10px;
}

@keyframes loaderHide{
    to{
        opacity:0;
        visibility:hidden;
    }
}

@keyframes loaderPulse{
    from{
        opacity:.3;
        transform:scale(.97);
    }
    to{
        opacity:1;
        transform:scale(1);
    }
}

/* =========================
   NAVIGATION
========================= */

nav{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    z-index:1000;

    padding:18px 7%;

    display:flex;
    justify-content:space-between;
    align-items:center;

    background:rgba(4,4,4,.75);
    backdrop-filter:blur(18px);

    border-bottom:1px solid var(--line);
}

.logo{
    font-family:Georgia,serif;
    font-size:21px;
    font-weight:900;
    letter-spacing:3px;
    color:var(--accent);
}

nav ul{
    display:flex;
    gap:24px;
    list-style:none;
}

nav a{
    color:#aaa;
    text-decoration:none;
    font-size:13px;
    transition:.3s;
}

nav a:hover{
    color:var(--accent);
}

   HERO
========================= */

    min-height:100vh;

    display:flex;

    text-align:center;

    position:relative;
    overflow:hidden;

    background:
    radial-gradient(
        circle at 50% 40%,
        rgba(0,234,255,.16),
        transparent 30%

}

#home::before{
    content:"";

    position:absolute;

    width:620px;
    height:620px;

    border:1px solid rgba(0,234,255,.13);

    border-radius:50%;

    animation:rotateCircle 16s linear infinite;
}

#home::after{
    content:"";

    position:absolute;

    width:900px;
    height:900px;

    border:1px solid rgba(255,255,255,.04);

    border-radius:50%;
}

@keyframes rotateCircle{

    from{
        transform:rotate(0deg);
    }

    to{
        transform:rotate(360deg);
    }

}

    0 0 30px rgba(0,234,255,.12);
}
